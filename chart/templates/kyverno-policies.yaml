{{- if and .Values.global.monitoring.enabled (not .Values.global.ambient) }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ .Release.Name }}-mutate-servicemonitor-mtls
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  rules:
    - name: add-mtls-to-endpoints
      match:
        any:
          - resources:
              kinds:
                - ServiceMonitor
              namespaces:
                - {{ .Release.Namespace }}
      mutate:
        foreach:
          - list: "request.object.spec.endpoints"
            patchesJson6902: |-
              - op: add
                path: /spec/endpoints/{{`{{elementIndex}}`}}/scheme
                value: https
              - op: add
                path: /spec/endpoints/{{`{{elementIndex}}`}}/tlsConfig
                value:
                  caFile: /etc/prom-certs/root-cert.pem
                  certFile: /etc/prom-certs/cert-chain.pem
                  keyFile: /etc/prom-certs/key.pem
                  insecureSkipVerify: true
{{- end }}
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ .Release.Name }}-mutate-grpc-test-timeout
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  rules:
    - name: add-grpc-timeout
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Release.Namespace }}
      preconditions:
        all:
          - key: "{{ `{{ request.object.metadata.annotations.\"helm.sh/hook\" || '' }}` }}"
            operator: AnyIn
            value: ["test", "test-success"]
          - key: "{{ `{{ request.object.spec.containers[0].name }}` }}"
            operator: Equals
            value: "grpc-health-probe"
      mutate:
        patchesJson6902: |-
          - op: add
            path: /spec/containers/0/args/-
            value: "-connect-timeout=5s"
---
{{- if not .Values.global.ambient }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ .Release.Name }}-mutate-test-sidecar-inject
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  rules:
    - name: inject-sidecar-into-helm-tests
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - {{ .Release.Namespace }}
      preconditions:
        all:
          - key: "{{ `{{ request.object.metadata.annotations.\"helm.sh/hook\" || '' }}` }}"
            operator: AnyIn
            value: ["test", "test-success"]
      mutate:
        patchesJson6902: |-
          - op: replace
            path: /metadata/annotations/sidecar.istio.io~1inject
            value: "true"
{{- end }}
