podinfo:
  image:
    repository: registry1.dso.mil/ironbank/opensource/bigbang/podinfo
    tag: 6.10.1

bb-common:
  networkPolicies:
    enabled: true
  routes:
    inbound:
      podinfo:
        enabled: true
        hosts:
          - podinfo.dev.bigbang.mil
        gateways:
          - istio-gateway/public-ingressgateway
        service: podinfo
        port: 9898
  istio:
    enabled: true
    authorizationPolicies:
      enabled: true
