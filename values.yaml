      podinfo:
        enabled: true
        hosts:
          - podinfo.dev.bigbang.mil
        gateways:
          - istio-gateway/public-ingressgateway
        service: podinfo
        port: 9898

  istio:
    enabled: true

    authorizationPolicies:
      enabled: true
